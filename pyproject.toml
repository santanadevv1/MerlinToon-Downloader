[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "santana-chapter-downloader"
version = "1.2.0"
description = "Parallel, resumable chapter image downloader"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Santana" }]

[project.optional-dependencies]
browser = ["selenium>=4.6"]

[project.scripts]
chapterdl = "chapterdl.cli:main"

[tool.setuptools]
packages = ["chapterdl"]

[tool.setuptools.package-data]
chapterdl = ["bypass_node/*.js", "bypass_node/*.json", "bypass_node/*.md", "bypass_node/src/*.js"]
